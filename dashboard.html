      ${d.winners.length > 0 ? `
        <div class="mb-5">
          <h4 class="font-bold text-gray-800 mb-2 text-sm uppercase tracking-wide">Daftar Pemenang</h4>
          <table class="w-full text-sm border border-gray-200">
            <thead class="bg-gray-50">
              <tr class="text-left text-xs text-gray-600">
                <th class="px-2 py-1.5">Putaran</th><th class="px-2 py-1.5">No</th>
                <th class="px-2 py-1.5">Nama</th>
                <th class="px-2 py-1.5 hidden sm:table-cell">Metode</th>
                <th class="px-2 py-1.5 hidden sm:table-cell">Tanggal</th>
              </tr>
            </thead>
            <tbody>
              ${d.winners.map(w => `
                <tr class="border-t border-gray-100">
                  <td class="px-2 py-1.5 font-semibold">${w.period_number}</td>
                  <td class="px-2 py-1.5 font-bold">${String(w.member_number).padStart(2, '0')}</td>
                  <td class="px-2 py-1.5">${escapeHtml(w.member_name)}</td>
                  <td class="px-2 py-1.5 hidden sm:table-cell text-xs">${w.draw_method}</td>
                  <td class="px-2 py-1.5 hidden sm:table-cell text-xs">${timestampToString(w.drawn_at)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>` : ''}

      ${d.transactions.length > 0 ? `
        <div class="mb-5">
          <h4 class="font-bold text-gray-800 mb-2 text-sm uppercase tracking-wide">Daftar Transaksi</h4>
          <table class="w-full text-sm border border-gray-200">
            <thead class="bg-gray-50">
              <tr class="text-left text-xs text-gray-600">
                <th class="px-2 py-1.5">Tanggal</th><th class="px-2 py-1.5">Tipe</th>
                <th class="px-2 py-1.5 hidden sm:table-cell">Kategori</th>
                <th class="px-2 py-1.5">Deskripsi</th>
                <th class="px-2 py-1.5 text-right">Jumlah</th>
              </tr>
            </thead>
            <tbody>
              ${d.transactions.slice(0, 100).map(t => `
                <tr class="border-t border-gray-100">
                  <td class="px-2 py-1.5 text-xs">${formatDate(t.transaction_date)}</td>
                  <td class="px-2 py-1.5 text-xs ${t.type === 'income' ? 'text-emerald-700' : 'text-red-700'} font-semibold">${t.type === 'income' ? 'Masuk' : 'Keluar'}</td>
                  <td class="px-2 py-1.5 hidden sm:table-cell text-xs">${escapeHtml(t.category || '-')}</td>
                  <td class="px-2 py-1.5 text-xs">${escapeHtml(t.description || '-')}</td>
                  <td class="px-2 py-1.5 text-right text-xs font-semibold">${formatIDR(t.amount)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>` : ''}

      <div class="border-t-2 border-gray-800 pt-3 mt-5 text-xs text-gray-500 flex justify-between">
        <div>Dicetak dari <strong>${escapeHtml(d.app_name || 'ArisanKita')}</strong></div>
        <div>Halaman 1 dari 1</div>
      </div>
    </article>`;

  document.getElementById('printRepBtn').classList.remove('hidden');
  document.getElementById('shareWaBtn').classList.remove('hidden');
  document.getElementById('printRepBtn').onclick = () => printReport();
  document.getElementById('shareWaBtn').onclick = () => shareReportWa(d);
}

function printReport() {
  const area = document.getElementById('reportPrintArea');
  if (!area) return;
  const appName = state.appName || 'ArisanKita';
  const w = window.open('', '_blank');
  w.document.write(`
    <html><head><title>Laporan ${appName.replace(/[<>&"']/g, '')}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"><\/script>
    <style>
      @media print { @page { margin: 1cm; } body { font-size: 11px; } }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #111; background: white; }
    </style>
    </head><body class="p-4">
    ${area.outerHTML}
    <script>window.onload = () => setTimeout(() => window.print(), 500);<\/script>
    </body></html>`);
  w.document.close();
}

function shareReportWa(d) {
  const appName = d.app_name || state.appName || 'ArisanKita';
  const lines = [];
  lines.push('*LAPORAN ARISAN*');
  lines.push('Kelompok: ' + d.filter.group_name);
  lines.push((d.filter.period_label || 'Semua Putaran'));
  lines.push('');
  lines.push('*Keuangan:*');
  lines.push('Pemasukan: ' + formatIDR(d.summary.totalIncome));
  lines.push('Pengeluaran: ' + formatIDR(d.summary.totalExpense));
  lines.push('Saldo: ' + formatIDR(d.summary.saldo));
  lines.push('');
  lines.push('*Pembayaran:*');
  lines.push('Total: ' + d.summary.totalTagihan);
  lines.push('Lunas: ' + d.summary.totalLunas);
  lines.push('Sebagian: ' + d.summary.totalPartial);
  lines.push('Belum: ' + d.summary.totalBelum);
  lines.push('');
  lines.push('_Dikirim dari ' + appName + '_');
  const url = 'https://wa.me/?text=' + encodeURIComponent(lines.join('\n'));
  window.open(url, '_blank');
}

/* ============================================================
   SETTINGS (Firebase)
   ============================================================ */
async function renderSettings() {
  try {
    const res = await state.settingsModule.getSettings();
    if (res.ok) state.cache.settings = res.data;
  } catch (e) {
    console.error('Load settings error:', e);
  }
  const s = state.cache.settings;

  document.getElementById('mainContent').innerHTML = `
    <section class="bg-gray-800 rounded-2xl p-4 sm:p-6 shadow-sm border border-gray-700 max-w-2xl">
      <h3 class="font-bold text-gray-100 mb-4 flex items-center gap-2"><i class="fa-solid fa-gear text-blue-400"></i> Pengaturan Aplikasi</h3>
      <form id="settingsForm" class="space-y-3">
        <div><label class="block text-sm font-medium text-gray-300 mb-1">Nama Aplikasi</label>
        <input id="sAppName" type="text" value="${escapeHtml(s.app_name || 'ArisanKita')}" class="w-full px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 outline-none text-sm"></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-sm font-medium text-gray-300 mb-1">Mata Uang</label>
          <input id="sCurrency" type="text" value="${escapeHtml(s.currency || 'IDR')}" class="w-full px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:border-blue-500 outline-none text-sm"></div>
          <div><label class="block text-sm font-medium text-gray-300 mb-1">Zona Waktu</label>
          <input id="sTimezone" type="text" value="${escapeHtml(s.timezone || 'Asia/Jakarta')}" class="w-full px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:border-blue-500 outline-none text-sm">
          <p class="text-[11px] text-gray-500 mt-1">Contoh: Asia/Jakarta</p></div>
        </div>
        <div class="border-t border-gray-700 pt-3 mt-3 bg-blue-900/20 rounded-lg p-3">
          <h4 class="font-semibold text-blue-300 text-sm mb-2 flex items-center gap-2"><i class="fa-solid fa-shield-halved"></i> Info Autentikasi</h4>
          <p class="text-xs text-gray-400">Login admin menggunakan Firebase Authentication.</p>
          <p class="text-xs text-gray-400 mt-1">Email: <strong class="text-gray-200">${escapeHtml(state.user?.email || '-')}</strong></p>
          <p class="text-xs text-gray-500 mt-2">Untuk mengubah email/password, gunakan Firebase Console.</p>
        </div>
        <div class="flex justify-end pt-3">
          <button type="submit" id="sSave" class="px-5 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold shadow-sm transition"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
        </div>
      </form>
    </section>`;

  document.getElementById('settingsForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {
      app_name: document.getElementById('sAppName').value.trim(),
      currency: document.getElementById('sCurrency').value.trim(),
      timezone: document.getElementById('sTimezone').value.trim()
    };
    const btn = document.getElementById('sSave');
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
    pauseIdle();
    try {
      const res = await state.settingsModule.updateSettings(data);
      if (res.ok) {
        toast(res.message, 'success');
        Object.assign(state.cache.settings, data);
        if (data.app_name) applyAppName(data.app_name);
      } else toast(res.message, 'error');
    } catch (err) {
      console.error(err);
      toast('Terjadi kesalahan.', 'error');
    }
    finally { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Simpan'; resumeIdle(); }
  });
}

/* ============================================================
   EVENT LISTENERS
   ============================================================ */
function setupEventListeners() {
  $('menuToggle').addEventListener('click', () => {
    $('sidebar').classList.remove('-translate-x-full');
    $('sidebarOverlay').classList.remove('hidden');
  });
  $('sidebarOverlay').addEventListener('click', () => {
    $('sidebar').classList.add('-translate-x-full');
    $('sidebarOverlay').classList.add('hidden');
  });
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      switchView(btn.dataset.view);
      if (window.innerWidth < 1024) {
        $('sidebar').classList.add('-translate-x-full');
        $('sidebarOverlay').classList.add('hidden');
      }
    });
  });
  $('logoutBtn').addEventListener('click', async () => {
    if (!confirm('Yakin ingin keluar?')) return;
    await doLogout('Anda logout manual.');
  });
  document.querySelectorAll('[data-close-modal]').forEach(el => el.addEventListener('click', closeModal));
  $('year').textContent = new Date().getFullYear();
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
(async function init() {
  setupEventListeners();
  setupIdleUI();
  registerIdleListeners();

  const modulesLoaded = await loadFirebaseModules();
  if (!modulesLoaded) {
    document.getElementById('mainContent').innerHTML = `
      <div class="max-w-md mx-auto mt-10 bg-red-900/40 border border-red-700/50 rounded-2xl p-6 text-center">
        <div class="text-5xl mb-3 text-red-400"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h3 class="font-bold text-red-200 text-lg mb-2">Gagal Memuat Modul</h3>
        <p class="text-sm text-red-300 mb-5">Periksa koneksi atau hubungi developer.</p>
      </div>`;
    return;
  }

  const ok = await ensureAuth();
  if (!ok) return;

  const loaded = await loadAllData();
  if (loaded) {
    switchView('dashboard');
    resetIdleTimers();
    setupRealtimeListeners();  // NEW
  }
})();

/**
 * Setup real-time listeners untuk payments, winners, notifications
 */
/* ============================================================
   SETUP REALTIME LISTENERS
   ============================================================ */
function setupRealtimeListeners() {
  try {
    // 1. Cleanup listener lama
    if (state.payListeners && state.payListeners.length) {
      state.payListeners.forEach(fn => { try { fn(); } catch (e) {} });
    }
    state.payListeners = [];

    // 2. Listener PAYMENTS
    const unsubPay = state.paymentsModule.subscribePayments((list) => {
      state.cache.payments = list;
      state.cache.dashboard = computeDashboardStats();
      if (state.currentView === 'payments') {
        try { renderPaymentsList(); } catch (e) {}
      }
      if (state.currentView === 'dashboard') {
        try { renderDashboard(); } catch (e) {}
      }
    });
    state.payListeners.push(unsubPay);

    // 3. Listener TRANSACTIONS
    const unsubTrx = state.transactionsModule.subscribeTransactions((list) => {
      state.cache.transactions = list;
      state.cache.dashboard = computeDashboardStats();
      if (state.currentView === 'finance') {
        try { renderTransactionRows(list); } catch (e) {}
      }
      if (state.currentView === 'dashboard') {
        try { renderDashboard(); } catch (e) {}
      }
    });
    state.payListeners.push(unsubTrx);

    // 4. Listener WINNERS
    const unsubWin = state.winnersModule.subscribeWinners((list) => {
      state.cache.winners = list;
      state.cache.dashboard = computeDashboardStats();
      if (state.currentView === 'winners') {
        try { renderWinnerRows(filterWinnersList()); } catch (e) {}
      }
      if (state.currentView === 'dashboard') {
        try { renderDashboard(); } catch (e) {}
      }
    });
    state.payListeners.push(unsubWin);

    // 5. Listener NOTIFICATIONS
    const unsubNotif = state.notificationsModule.subscribeNotifications((list) => {
      state.cache.notifications = list;
      const unread = list.filter(n => n.status === 'unread').length;
      updateNotifBadge(unread);
      if (state.currentView === 'notifications') {
        try { renderNotificationItems(list); } catch (e) {}
      }
    });
    state.notifListener = unsubNotif;

    // 6. Listener LOGS
    const unsubLogs = state.logsModule.subscribeLogs((list) => {
      state.cache.logs = list;
      if (state.currentView === 'logs') {
        try { renderLogRows(list); } catch (e) {}
      }
    });
    state.payListeners.push(unsubLogs);

    console.log('✅ Real-time listeners aktif (5 listeners)');
  } catch (e) {
    console.error('setupRealtimeListeners error:', e);
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('✅ SW registered:', reg.scope))
      .catch(err => console.warn('⚠️ SW failed:', err));
  });
}
