<script>

/* ============================================================
   GLOBAL ALIAS (lazy - akses window.FB saat dipanggil)
   ============================================================ */
function escapeHtml(s) {
  try { return window.FB.escapeHtml(s); }
  catch (e) { return String(s == null ? '' : s); }
}
function formatIDR(n) {
  try { return window.FB.formatIDR(n); }
  catch (e) { return 'Rp ' + Number(n || 0).toLocaleString('id-ID'); }
}
function normalizePhone(p) {
  try { return window.FB.normalizePhone(p); }
  catch (e) { return String(p || ''); }
}
function fillTemplate(t, v) {
  try { return window.FB.fillTemplate(t, v); }
  catch (e) { return String(t || ''); }
}
function openWhatsApp(p, m) {
  try { return window.FB.openWhatsApp(p, m); }
  catch (e) { alert('Gagal membuka WhatsApp'); return false; }
}
function timestampToString(ts) {
  try { return window.FB.timestampToString(ts); }
  catch (e) { return '-'; }
}
function timestampToDateTime(ts) {
  try { return window.FB.timestampToDateTime(ts); }
  catch (e) { return '-'; }
}
function generateId(prefix) {
  try { return window.FB.generateId(prefix); }
  catch (e) { return prefix + '_' + Date.now() + '_' + Math.floor(Math.random() * 10000); }
}
function nowTimestamp() {
  try { return window.FB.nowTimestamp(); }
  catch (e) { return new Date(); }
}

/* ============================================================
   GLOBAL ERROR HANDLER
   ============================================================ */
window.addEventListener('error', (e) => {
  console.error('❌ Global error:', e.message, e.error);
  // Hanya tampil toast kalau bukan error module loading
  if (e.message && !e.message.includes('Module') && !e.message.includes('import')) {
    try { toast('Terjadi kesalahan. Silakan coba lagi.', 'error'); } catch (err) {}
  }
});

window.addEventListener('unhandledrejection', (e) => {
  console.error('❌ Unhandled promise rejection:', e.reason);
  const msg = e.reason?.message || String(e.reason || '');
  if (msg.includes('permission') || msg.includes('permissions')) {
    try { toast('Akses ditolak. Cek aturan Firestore.', 'error'); } catch (err) {}
  } else if (msg.includes('network') || msg.includes('offline')) {
    try { toast('Koneksi bermasalah. Cek internet.', 'error'); } catch (err) {}
  } else {
    try { toast('Terjadi kesalahan.', 'error'); } catch (err) {}
  }
});

/* ============================================================
   STATE
   ============================================================ */
const state = {
  user: null,
  appName: 'ArisanKita',
  currentView: 'dashboard',
  cache: {
    dashboard: null,
    members: [],
    groups: [],
    payments: [],
    winners: [],
    transactions: [],
    notifications: [],
    logs: [],
    settings: {}
  },
  dataLoaded: false,
  countdownTimer: null,
  drawState: { groupId: '', period: 1, method: 'random', candidates: [], winner: null, animating: false },
  membersModule: null,
  groupsModule: null,
  groupMembersModule: null,
  paymentsModule: null,
  winnersModule: null,
  notificationsModule: null,
  transactionsModule: null,
  logsModule: null,
  settingsModule: null,
  payListeners: [],
  notifListener: null
};

/* ============================================================
   LOAD FIREBASE MODULES
   ============================================================ */
async function loadFirebaseModules() {
  try {
    state.membersModule = await import('./firebase-members.js');
    state.groupsModule = await import('./firebase-groups.js');
    state.groupMembersModule = await import('./firebase-group-members.js');
    state.paymentsModule = await import('./firebase-payments.js');
    state.winnersModule = await import('./firebase-winners.js');
    state.notificationsModule = await import('./firebase-notifications.js');
    state.transactionsModule = await import('./firebase-transactions.js');
    state.logsModule = await import('./firebase-logs.js');
    state.settingsModule = await import('./firebase-settings.js');
    console.log('✅ Firebase modules loaded');
    return true;
  } catch (e) {
    console.error('Module load error:', e);
    return false;
  }
}

/* ============================================================
   DO LOGOUT
   ============================================================ */
async function doLogout(reason) {
  try {
    if (reason) {
      try { localStorage.setItem('arisan_logout_reason', reason); } catch (e) {}
    }
    await window.FBAuth.logoutAdmin();
  } catch (e) {
    window.location.href = 'login.html';
  }
}

/* ============================================================
   ENSURE AUTH
   ============================================================ */
async function ensureAuth() {
  // // ⚠️ DEV MODE: Bypass login
  // console.warn('⚠️ DEV MODE: Auth bypassed. JANGAN dipakai di production!');
  
  // state.user = { email: 'dev@local', uid: 'dev-mode' };
  // const userLabel = document.getElementById('userLabel');
  // if (userLabel) userLabel.textContent = 'Dev Mode';
  // return true;

  // ═══════════════════════════════════════════════════════════
  // KODE ASLI — Aktifkan kembali untuk production
  // ═══════════════════════════════════════════════════════════
  try {
    const result = await window.FBAuth.checkAuth();
    if (!result.ok) {
      window.location.href = 'login.html';
      return false;
    }
    state.user = result.user;
    const userLabel = document.getElementById('userLabel');
    if (userLabel) userLabel.textContent = result.user.email || 'admin';
    return true;
  } catch (e) {
    console.error('ensureAuth error:', e);
    window.location.href = 'login.html';
    return false;
  }
}

/* ============================================================
   LOAD ALL DATA
   ============================================================ */
async function loadAllData() {
  const main = document.getElementById('mainContent');
  if (main) {
  main.innerHTML = `
    <div class="space-y-4 animate-pulse">
      <div class="grid grid-cols-2 lg:grid-cols-5 gap-3">
        ${Array(5).fill(0).map(() => '<div class="bg-gray-800 rounded-2xl p-4 h-20"></div>').join('')}
      </div>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        ${Array(4).fill(0).map(() => '<div class="bg-gray-800 rounded-2xl p-4 h-20"></div>').join('')}
      </div>
      <div class="grid grid-cols-3 gap-3">
        ${Array(3).fill(0).map(() => '<div class="bg-gray-800 rounded-2xl p-4 h-20"></div>').join('')}
      </div>
      <div class="bg-gray-800 rounded-2xl p-5 h-40"></div>
    </div>`;
  }

  try {
    // Load settings
    try {
      const settingsRef = window.FB.doc(window.FB.db, 'settings', 'app');
      const settingsSnap = await window.FB.getDoc(settingsRef);
      if (settingsSnap.exists()) {
        state.cache.settings = settingsSnap.data();
        if (state.cache.settings.app_name) applyAppName(state.cache.settings.app_name);
      }
    } catch (e) { console.warn('Settings load error:', e); }

    // Load members
    const membersRes = await state.membersModule.getMembers({});
    state.cache.members = membersRes.ok ? membersRes.data : [];

    // Load groups
    const groupsRes = await state.groupsModule.getGroups();
    state.cache.groups = groupsRes.ok ? groupsRes.data : [];

    // Load payments
    const payRes = await state.paymentsModule.getPayments({});
    state.cache.payments = payRes.ok ? payRes.data : [];

    // Load winners
    const winRes = await state.winnersModule.getWinnerHistory({});
    state.cache.winners = winRes.ok ? winRes.data : [];

    // Load notifications
    const notifRes = await state.notificationsModule.getNotifications({});
    state.cache.notifications = notifRes.ok ? notifRes.data : [];

    // Load transactions (langsung dari Firestore)
    try {
      const trxRef = window.FB.collection(window.FB.db, 'transactions');
      const trxSnap = await window.FB.getDocs(trxRef);
      const trxList = [];
      trxSnap.forEach(d => trxList.push({ id: d.id, ...d.data() }));
      
      // Sort by transaction_date desc
      trxList.sort((a, b) => {
        const da = new Date(a.transaction_date || 0);
        const db2 = new Date(b.transaction_date || 0);
        return db2 - da;
      });
      
      state.cache.transactions = trxList;
    } catch (e) {
      console.warn('Load transactions error:', e);
      state.cache.transactions = [];
    }

    // Load logs
    try {
      const logsRes = await state.logsModule.getLogs(200);
      state.cache.logs = logsRes.ok ? logsRes.data : [];
    } catch (e) {
      console.warn('Load logs error:', e);
      state.cache.logs = [];
    }

    // Compute dashboard
    state.cache.dashboard = computeDashboardStats();

    state.dataLoaded = true;

    // Auto-check backfill (jalankan di background, tidak block UI)
    setTimeout(async () => {
      try {
        const trxRef = window.FB.collection(window.FB.db, 'transactions');
        const trxSnap = await window.FB.getDocs(trxRef);
        const existingPaymentIds = new Set();
        trxSnap.forEach(d => {
          if (d.data().payment_id) existingPaymentIds.add(d.data().payment_id);
        });

        const missingCount = state.cache.payments.filter(p =>
          p.status === 'paid' && !existingPaymentIds.has(p.id)
        ).length;

        if (missingCount > 0) {
          console.log(`⚠️ ${missingCount} payments belum punya transaksi, auto-backfill...`);
          await state.paymentsModule.backfillTransactions();
          console.log('✅ Auto-backfill selesai');
        }
      } catch (e) {
        console.warn('Auto-backfill check error:', e);
      }
    }, 2000); // Delay 2 detik, biar UI sudah tampil

    return true;
  } catch (e) {
    console.error('loadAllData error:', e);
    showErrorState(e.message);
    return false;
  }
}

/* ============================================================
   COMPUTE DASHBOARD
   ============================================================ */
function computeDashboardStats() {
  const members = state.cache.members || [];
  const groups = state.cache.groups || [];
  const payments = state.cache.payments || [];
  const transactions = state.cache.transactions || [];
  const winners = state.cache.winners || [];
  const notifications = state.cache.notifications || [];

  const totalIncome = transactions.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount || 0), 0);
  const totalExpense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0);  const paidCount = payments.filter(p => p.status === 'paid').length;
  const unpaidCount = payments.filter(p => p.status !== 'paid').length;
  const activeGroups = groups.filter(g => g.status === 'active');
  const totalGroupMembers = groups.reduce((sum, g) => sum + (g.member_count || 0), 0);

  return {
    app_name: state.appName,
    totalMembers: members.length,
    activeMembers: members.filter(m => m.status === 'active').length,
    totalGroups: groups.length,
    activeGroups: activeGroups.length,
    totalGroupMembers: totalGroupMembers,
    totalPayments: payments.length,
    paidCount: paidCount,
    unpaidCount: unpaidCount,
    totalIncome: totalIncome,
    totalExpense: totalExpense,
    balance: totalIncome - totalExpense,
    totalWinners: winners.length,
    unreadNotif: notifications.filter(n => n.status === 'unread').length,
    nearestDue: null,
    latestWinner: winners[0] || null,
    activeGroupsList: activeGroups.map(g => ({
      ...g,
      member_count: g.member_count || 0
    }))
  };
}

/* ============================================================
   SHOW ERROR STATE
   ============================================================ */
function showErrorState(message) {
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="max-w-md mx-auto mt-10 bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-700 text-center">
      <div class="text-5xl mb-3 text-red-400"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <h3 class="font-bold text-gray-100 text-lg mb-2">Gagal Memuat Data</h3>
      <p class="text-sm text-gray-400 mb-5">${escapeHtml(message || 'Periksa koneksi internet Anda, lalu coba lagi.')}</p>
      <button id="retryLoadBtn" class="px-5 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition">
        <i class="fa-solid fa-rotate-right"></i> Coba Lagi
      </button>
    </div>`;
  document.getElementById('retryLoadBtn').addEventListener('click', async () => {
    const ok = await loadAllData();
    if (ok) switchView(state.currentView || 'dashboard');
  });
}

/* ============================================================
   APPLY APP NAME (kalau belum ada, tidak masalah)
   ============================================================ */
const viewTitles = {
  dashboard: 'Dashboard',
  members: 'Manajemen Anggota',
  groups: 'Kelompok Arisan',
  payments: 'Pembayaran',
  reminders: 'Reminder WhatsApp',
  draw: 'Pengundian Pemenang',
  winners: 'Riwayat Pemenang',
  finance: 'Keuangan',
  reports: 'Cetak Laporan',
  notifications: 'Notifikasi',
  logs: 'Log Aktivitas',
  settings: 'Pengaturan'
};

function applyAppName(name) {
  if (!name) return;
  state.appName = name;

/* ============================================================
   IDLE TIMEOUT
   ============================================================ */
const idle = {
  timeout: 10 * 60 * 1000,
  warningDuration: 30 * 1000,
  lastActivity: Date.now(),
  warningTimer: null,
  logoutTimer: null,
  countdownInterval: null,
  warningShown: false,
  paused: false,
  events: ['mousemove', 'mousedown', 'keydown', 'touchstart', 'touchmove', 'scroll', 'click']
};

function registerIdleListeners() {
  idle.events.forEach(evt => {
    document.addEventListener(evt, onUserActivity, { passive: true });
  });
}
function onUserActivity() {
  if (idle.warningShown) return;
  if (idle.paused) return;
  idle.lastActivity = Date.now();
  resetIdleTimers();
}
function resetIdleTimers() {
  clearTimeout(idle.warningTimer);
  clearTimeout(idle.logoutTimer);
  idle.warningTimer = setTimeout(showIdleWarning, idle.timeout);
}
function pauseIdle() {
  idle.paused = true;
  clearTimeout(idle.warningTimer);
  clearTimeout(idle.logoutTimer);
}
function resumeIdle() {
  idle.paused = false;
  idle.lastActivity = Date.now();
  resetIdleTimers();
  hideIdleWarning();
}
function showIdleWarning() {
  if (idle.warningShown) return;
  idle.warningShown = true;
  $('idleWarning').classList.remove('hidden');
  let remaining = Math.floor(idle.warningDuration / 1000);
  $('idleCountdown').textContent = remaining;
  idle.countdownInterval = setInterval(() => {
    remaining--;
    if (remaining >= 0) $('idleCountdown').textContent = remaining;
    if (remaining <= 0) clearInterval(idle.countdownInterval);
  }, 1000);
  idle.logoutTimer = setTimeout(() => {
    doLogout('Sesi berakhir karena tidak aktif selama 10 menit.');
  }, idle.warningDuration);
}
function hideIdleWarning() {
  idle.warningShown = false;
  $('idleWarning').classList.add('hidden');
  if (idle.countdownInterval) clearInterval(idle.countdownInterval);
  clearTimeout(idle.logoutTimer);
}
function setupIdleUI() {
  $('idleExtendBtn').addEventListener('click', () => {
    hideIdleWarning();
    idle.lastActivity = Date.now();
    resetIdleTimers();
    toast('Sesi diperpanjang.', 'success');
  });
  $('idleLogoutBtn').addEventListener('click', () => {
    hideIdleWarning();
    doLogout('Anda logout manual.');
  });
}

function startCountdown(dueDate) {
  if (state.countdownTimer) clearInterval(state.countdownTimer);
  const box = $('countdownBox');
  if (!box) return;
  const target = new Date(dueDate).getTime();
  function tick() {
    const diff = target - Date.now();
    if (diff <= 0) {
      box.innerHTML = '<div class="col-span-4 text-red-400 font-bold text-lg">TERLAMBAT</div>';
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    box.innerHTML = [['Hari', d], ['Jam', h], ['Menit', m], ['Detik', s]].map(([l, v]) => `
      <div class="bg-blue-900/40 rounded-lg py-2 ring-1 ring-blue-700/50">
        <div class="text-lg font-bold text-blue-300">${v}</div>
        <div class="text-[10px] text-blue-400 uppercase">${l}</div>
      </div>`).join('');
  }
  tick();
  state.countdownTimer = setInterval(tick, 1000);
}

    const m = state.cache.members.find(x => x.id === b.dataset.editMember);
    if (m) showMemberModal(m);
  }));
  tbody.querySelectorAll('[data-del-member]').forEach(b => b.addEventListener('click', () => confirmDeleteMember(b.dataset.delMember)));
}

  openModal(isEdit ? 'Edit Anggota' : 'Tambah Anggota', `

        <div><label class="block text-sm font-medium text-gray-300 mb-1">Status</label>
        <select id="mStatus" class="w-full px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:border-blue-500 outline-none text-sm">

      </div>
      <div><label class="block text-sm font-medium text-gray-300 mb-1">Nama Lengkap *</label>
      <input id="mName" type="text" value="${isEdit ? escapeHtml(m.name) : ''}" required class="w-full px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 outline-none text-sm"></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div><label class="block text-sm font-medium text-gray-300 mb-1">No. HP</label>
        <input id="mPhone" type="text" value="${isEdit ? escapeHtml(m.phone || '') : ''}" placeholder="08xxx" class="w-full px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 placeholder-gray-500 focus:border-blue-500 outline-none text-sm"></div>
        <div><label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
        <input id="mEmail" type="email" value="${isEdit ? escapeHtml(m.email || '') : ''}" class="w-full px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:border-blue-500 outline-none text-sm"></div>
      </div>
      <div><label class="block text-sm font-medium text-gray-300 mb-1">Alamat</label>
      <textarea id="mAddress" rows="2" class="w-full px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:border-blue-500 outline-none text-sm">${isEdit ? escapeHtml(m.address || '') : ''}</textarea></div>

      <div class="border-t border-gray-700 pt-3">
        <label class="block text-sm font-medium text-gray-300 mb-2"><i class="fa-solid fa-users"></i> Kelompok yang Diikuti</label>
        ${state.cache.groups.length ? `
          <div class="max-h-40 overflow-y-auto border border-gray-600 rounded-lg p-2 space-y-1 bg-gray-700/50">
            ${state.cache.groups.map(g => {
              const isDisabled = !isEdit && (g.putaran_aktif > 1);
              return `
              <label class="flex items-center gap-2 px-2 py-1 rounded ${isDisabled ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-700 cursor-pointer'}">
                <input type="checkbox" value="${g.id}" class="member-group-chk rounded bg-gray-700 border-gray-600" ${myGroupIds.indexOf(g.id) !== -1 ? 'checked' : ''} ${isDisabled ? 'disabled' : ''}>
                <span class="text-sm text-gray-200">${escapeHtml(g.name)}</span>
                ${isDisabled ? '<span class="text-[10px] text-red-400 ml-auto">Putaran ' + (g.putaran_aktif || 0) + '</span>' : '<span class="text-xs text-gray-500 ml-auto">' + g.period_days + 'h</span>'}
              </label>`;
            }).join('')}
          </div>
          <p class="text-[11px] text-gray-500 mt-1">Kelompok yang sudah masuk Putaran 2+ tidak bisa ditambahi anggota.</p>
        ` : '<p class="text-xs text-gray-500 italic">Belum ada kelompok.</p>'}
      </div>

      <div class="flex gap-2 justify-end pt-2">
        <button type="button" data-close-modal class="px-4 py-2 rounded-lg border border-gray-600 text-gray-300 hover:bg-gray-700 text-sm transition">Batal</button>
        <button type="submit" id="mSave" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition">Simpan</button>
      </div>
    </form>`);

  document.querySelectorAll('#modal [data-close-modal]').forEach(el => el.addEventListener('click', closeModal));

  document.getElementById('memberForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {
      number: Number(document.getElementById('mNumber').value) || 0,
      name: document.getElementById('mName').value.trim(),
      phone: document.getElementById('mPhone').value.trim(),
      email: document.getElementById('mEmail').value.trim(),
      address: document.getElementById('mAddress').value.trim(),
      status: document.getElementById('mStatus').value,
      group_ids: Array.from(document.querySelectorAll('.member-group-chk:checked')).map(c => c.value)
    };
    if (!data.name) { toast('Nama wajib diisi.', 'error'); return; }

    const btn = document.getElementById('mSave');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    pauseIdle();
    try {
      const res = isEdit
        ? await state.membersModule.updateMember(m.id, data)
        : await state.membersModule.createMember(data);
      if (res.ok) {
        toast(res.message, 'success');
        closeModal();
        await loadAllData();
        switchView('members');
      } else toast(res.message, 'error');
    } catch (err) {
      console.error(err);
      toast('Terjadi kesalahan.', 'error');
    }
    finally { btn.disabled = false; btn.textContent = 'Simpan'; resumeIdle(); }
  });
}

function confirmDeleteMember(id) {
  const m = state.cache.members.find(x => x.id === id);
  if (!m) return;
  openModal('Hapus Anggota', `
    <p class="text-sm text-gray-300">Yakin ingin menghapus <strong class="text-gray-100">${escapeHtml(m.name)}</strong> (No. ${m.number})?</p>
    <p class="text-xs text-red-400 mt-2"><i class="fa-solid fa-triangle-exclamation"></i> Anggota akan dihapus dari semua kelompok yang diikuti.</p>
    <div class="flex gap-2 justify-end pt-5">
      <button data-close-modal class="px-4 py-2 rounded-lg border border-gray-600 text-gray-300 hover:bg-gray-700 text-sm transition">Batal</button>
      <button id="confirmDel" class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white text-sm font-semibold transition">Hapus</button>
    </div>`);
  document.querySelectorAll('#modal [data-close-modal]').forEach(el => el.addEventListener('click', closeModal));
  document.getElementById('confirmDel').addEventListener('click', async () => {
    const btn = document.getElementById('confirmDel');
    btn.disabled = true; btn.textContent = 'Menghapus...';
    pauseIdle();
    try {
      const res = await state.membersModule.deleteMember(id);
      if (res.ok) {
        toast(res.message, 'success');
        closeModal();
        await loadAllData();
        switchView('members');
      } else toast(res.message, 'error');
    } catch (e) {
      console.error(e);
      toast('Terjadi kesalahan.', 'error');
    }
    finally { btn.disabled = false; btn.textContent = 'Hapus'; resumeIdle(); }
  });
}

      <div id="groupList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

function renderGroupCards(list) {
  const box = document.getElementById('groupList');
  const empty = document.getElementById('groupEmpty');
  if (!list.length) { box.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');

  box.innerHTML = list.map(g => {
    const canAdd = (g.putaran_aktif || 1) <= 1;
    return `
    <article class="border border-gray-700 rounded-xl p-4 hover:shadow-lg hover:border-gray-600 transition bg-gray-800">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <h4 class="font-bold text-gray-100 truncate">${escapeHtml(g.name)}</h4>
          <p class="text-xs text-gray-400 mt-1">${escapeHtml(g.description || 'Tanpa deskripsi')}</p>
        </div>
        <span class="inline-block text-xs px-2 py-0.5 rounded-full font-medium ${g.status === 'active' ? 'bg-emerald-900/50 text-emerald-300 ring-1 ring-emerald-700/50' : 'bg-gray-700 text-gray-400 ring-1 ring-gray-600'}">
          ${g.status === 'active' ? 'Aktif' : 'Nonaktif'}
        </span>
      </div>
      <div class="mt-3 grid grid-cols-2 gap-2 text-xs">
        <div class="bg-blue-900/40 rounded-lg p-2 ring-1 ring-blue-700/30"><div class="text-blue-300"><i class="fa-solid fa-users"></i> Anggota</div><div class="font-bold text-blue-200">${g.member_count || 0} orang</div></div>
        <div class="bg-amber-900/40 rounded-lg p-2 ring-1 ring-amber-700/30"><div class="text-amber-300"><i class="fa-solid fa-money-bill-wave"></i> Iuran</div><div class="font-bold text-amber-200">${formatIDR(g.amount)}</div></div>
        <div class="bg-emerald-900/40 rounded-lg p-2 ring-1 ring-emerald-700/30"><div class="text-emerald-300"><i class="fa-solid fa-calendar-days"></i> Periode</div><div class="font-bold text-emerald-200">${g.period_days} hari</div></div>
        <div class="bg-purple-900/40 rounded-lg p-2 ring-1 ring-purple-700/30"><div class="text-purple-300"><i class="fa-solid fa-credit-card"></i> Tagihan</div><div class="font-bold text-purple-200">${g.paid_count || 0}/${g.payment_count || 0}</div></div>
      </div>
      <div class="text-xs text-gray-400 mt-2">
        Mulai: ${formatDate(g.start_date)} •
        Putaran aktif: <strong class="${(g.putaran_aktif || 1) <= 1 ? 'text-emerald-400' : 'text-blue-400'}">${g.putaran_aktif || 1}</strong>
      </div>
      <div class="grid grid-cols-4 gap-1.5 mt-3">
        <button data-view-group="${g.id}" class="text-center px-2 py-1.5 rounded-lg bg-emerald-900/40 text-emerald-300 ring-1 ring-emerald-700/40 text-[11px] font-semibold hover:bg-emerald-900/60 transition"><i class="fa-solid fa-eye"></i> Detail</button>
        <button data-manage-group="${g.id}" class="text-center px-2 py-1.5 rounded-lg ${canAdd ? 'bg-purple-900/40 text-purple-300 ring-1 ring-purple-700/40 hover:bg-purple-900/60' : 'bg-gray-700 text-gray-500 cursor-not-allowed'} text-[11px] font-semibold transition" ${canAdd ? '' : 'disabled'}><i class="fa-solid fa-users"></i> Anggota</button>
        <button data-edit-group="${g.id}" class="text-center px-2 py-1.5 rounded-lg bg-blue-900/40 text-blue-300 ring-1 ring-blue-700/40 text-[11px] font-semibold hover:bg-blue-900/60 transition"><i class="fa-solid fa-pen"></i> Edit</button>
        <button data-del-group="${g.id}" class="text-center px-2 py-1.5 rounded-lg bg-red-900/40 text-red-300 ring-1 ring-red-700/40 text-[11px] font-semibold hover:bg-red-900/60 transition"><i class="fa-solid fa-trash"></i> Hapus</button>
      </div>
      <button data-sync-pay="${g.id}" class="w-full mt-2 text-center px-2 py-1.5 rounded-lg bg-amber-900/40 text-amber-300 ring-1 ring-amber-700/40 text-[11px] font-semibold hover:bg-amber-900/60 transition"><i class="fa-solid fa-rotate"></i> Sync Tagihan</button>
      ${!canAdd ? '<div class="text-[10px] text-amber-400 mt-2 text-center"><i class="fa-solid fa-lock"></i> Anggota hanya bisa ditambah di Putaran 1</div>' : ''}
    </article>`;
  }).join('');

  box.querySelectorAll('[data-view-group]').forEach(b => b.addEventListener('click', () => showGroupDetail(b.dataset.viewGroup)));
  box.querySelectorAll('[data-manage-group]').forEach(b => b.addEventListener('click', () => {
    if (b.disabled) return;
    showGroupMemberModal(b.dataset.manageGroup);
  }));
  box.querySelectorAll('[data-edit-group]').forEach(b => b.addEventListener('click', () => {
    const g = state.cache.groups.find(x => x.id === b.dataset.editGroup);
    if (g) showGroupModal(g);
  }));
  box.querySelectorAll('[data-del-group]').forEach(b => b.addEventListener('click', () => confirmDeleteGroup(b.dataset.delGroup)));
  box.querySelectorAll('[data-sync-pay]').forEach(b => b.addEventListener('click', async () => {
    const gid = b.dataset.syncPay;
    if (!confirm('Sync tagihan kelompok ini?\n\nAkan:\n- Hapus tagihan untuk anggota yang tidak aktif\n- Tambah tagihan yang belum ada\n- Hapus tagihan putaran berlebih')) return;
    
    b.disabled = true;
    const original = b.innerHTML;
    b.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sync...';
    pauseIdle();
    try {
      const res = await state.paymentsModule.autoGeneratePayments(gid);
      if (res.ok) {
        toast(`Sync berhasil: +${res.created} baru, -${res.deleted} dihapus`, 'success');
        await loadAllData();
        switchView('groups');
      } else {
        toast(res.message || 'Sync gagal.', 'error');
      }
    } catch (e) {
      console.error(e);
      toast('Terjadi kesalahan.', 'error');
    } finally {
      b.disabled = false;
      b.innerHTML = original;
      resumeIdle();
    }
  }));
}

function showGroupModal(g) {
  const isEdit = !!g;
  const today = new Date().toISOString().slice(0, 10);
  openModal(isEdit ? 'Edit Kelompok' : 'Tambah Kelompok', `
    <form id="groupForm" class="space-y-3">
      <div><label class="block text-sm font-medium text-gray-300 mb-1">Nama Kelompok *</label>
      <input id="gName" type="text" required value="${isEdit ? escapeHtml(g.name) : ''}" class="w-full px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 outline-none text-sm"></div>
      <div><label class="block text-sm font-medium text-gray-300 mb-1">Deskripsi</label>
      <textarea id="gDesc" rows="2" class="w-full px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:border-blue-500 outline-none text-sm">${isEdit ? escapeHtml(g.description || '') : ''}</textarea></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-sm font-medium text-gray-300 mb-1">Iuran (Rp) *</label>
        <input id="gAmount" type="number" min="1000" required value="${isEdit ? g.amount : 100000}" class="w-full px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:border-blue-500 outline-none text-sm"></div>
        <div><label class="block text-sm font-medium text-gray-300 mb-1">Periode (hari) *</label>
        <input id="gPeriod" type="number" min="1" max="365" required value="${isEdit ? g.period_days : 7}" class="w-full px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:border-blue-500 outline-none text-sm">
        <p class="text-[11px] text-gray-500 mt-1">Bebas: 3, 7, 14, 21, 30 hari, dst.</p></div>
      </div>
      <div class="bg-blue-900/40 border border-blue-700/50 rounded-lg p-3 text-xs">
        <div class="font-semibold text-blue-300 mb-1"><i class="fa-solid fa-calendar-days"></i> Preview Jatuh Tempo:</div>
        <div id="periodPreview" class="text-blue-200">Isi periode & tanggal mulai untuk lihat preview.</div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-sm font-medium text-gray-300 mb-1">Tanggal Mulai</label>
        <input id="gStart" type="date" value="${isEdit && g.start_date ? String(g.start_date).slice(0,10) : today}" class="w-full px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:border-blue-500 outline-none text-sm"></div>
        <div><label class="block text-sm font-medium text-gray-300 mb-1">Status</label>
        <select id="gStatus" class="w-full px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:border-blue-500 outline-none text-sm">
          <option value="active" ${isEdit && g.status === 'active' ? 'selected' : ''}>Aktif</option>
          <option value="inactive" ${isEdit && g.status === 'inactive' ? 'selected' : ''}>Nonaktif</option>
        </select></div>
      </div>
      <div><label class="block text-sm font-medium text-gray-300 mb-1">Izinkan Pemenang Berulang</label>
      <select id="gRepeat" class="w-full px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:border-blue-500 outline-none text-sm">
        <option value="false" ${isEdit && String(g.allow_repeat_winner) === 'true' ? '' : 'selected'}>Tidak (setiap anggota menang 1x)</option>
        <option value="true" ${isEdit && String(g.allow_repeat_winner) === 'true' ? 'selected' : ''}>Ya</option>
      </select></div>

      ${!isEdit ? `
      <div class="border-t border-gray-700 pt-3">
        <label class="block text-sm font-medium text-gray-300 mb-2"><i class="fa-solid fa-users"></i> Pilih Anggota yang Ikut (opsional)</label>
        <div id="memberCheckList" class="max-h-48 overflow-y-auto border border-gray-600 rounded-lg p-2 space-y-1 bg-gray-700/50">
          <div class="text-xs text-gray-400 text-center py-2">Memuat anggota...</div>
        </div>
      </div>` : ''}

      <div class="flex gap-2 justify-end pt-2">
        <button type="button" data-close-modal class="px-4 py-2 rounded-lg border border-gray-600 text-gray-300 hover:bg-gray-700 text-sm transition">Batal</button>
        <button type="submit" id="gSave" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition">Simpan</button>
      </div>
    </form>`);
  document.querySelectorAll('#modal [data-close-modal]').forEach(el => el.addEventListener('click', closeModal));

  const updatePreview = () => {
    const period = Number($('gPeriod').value) || 7;
    const startVal = $('gStart').value || today;
    const start = new Date(startVal);
    const previews = [];
    for (let i = 1; i <= 6; i++) {
      const d = new Date(start);
      d.setDate(d.getDate() + (i - 1) * period);
      previews.push('P' + i + ': ' + d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }));
    }
    $('periodPreview').innerHTML = previews.join(' • ') + ' ...';
  };
  $('gPeriod').addEventListener('input', updatePreview);
  $('gStart').addEventListener('change', updatePreview);
  updatePreview();

  if (!isEdit) {
    (async () => {
      try {
        const mres = await state.membersModule.getMembers({});
        const cl = $('memberCheckList');
        if (!cl) return;
        if (!mres.ok || !mres.data.length) {
          cl.innerHTML = '<div class="text-xs text-gray-400 text-center py-2">Belum ada anggota.</div>';
          return;
        }
        cl.innerHTML = mres.data.map(m => `
          <label class="flex items-center gap-2 px-2 py-1 rounded hover:bg-gray-700 cursor-pointer">
            <input type="checkbox" value="${m.id}" class="member-chk rounded bg-gray-700 border-gray-600">
            <span class="font-bold text-blue-400 text-xs">${String(m.number).padStart(2, '0')}</span>
            <span class="text-sm text-gray-200">${escapeHtml(m.name)}</span>
          </label>`).join('');
      } catch (e) { console.error(e); }
    })();
  }

  $('groupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {
      name: $('gName').value.trim(),
      description: $('gDesc').value.trim(),
      amount: Number($('gAmount').value) || 0,
      period_days: Number($('gPeriod').value) || 7,
      start_date: $('gStart').value,
      status: $('gStatus').value,
      allow_repeat_winner: $('gRepeat').value
    };
    if (!data.name) { toast('Nama wajib diisi.', 'error'); return; }
    if (data.amount <= 0) { toast('Jumlah iuran tidak valid.', 'error'); return; }
    if (data.period_days < 1 || data.period_days > 365) { toast('Periode harus 1-365 hari.', 'error'); return; }
    if (!isEdit) {
      const checked = Array.from(document.querySelectorAll('.member-chk:checked')).map(c => c.value);
      if (checked.length) data.member_ids = checked;
    }
    const btn = $('gSave');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    pauseIdle();
    try {
      const res = isEdit
        ? await state.groupsModule.updateGroup(g.id, data)
        : await state.groupsModule.createGroup(data);
      if (res.ok) {
        toast(res.message, 'success');
        closeModal();
        await loadAllData();
        switchView('groups');
      } else toast(res.message, 'error');
    } catch (err) { toast('Terjadi kesalahan.', 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Simpan'; resumeIdle(); }
  });
}

          <div class="bg-emerald-900/40 rounded-lg p-2 text-center ring-1 ring-emerald-700/30"><div class="text-emerald-300">Iuran</div><div class="text-sm font-bold text-emerald-200">${formatIDR(g.amount)}</div></div>

async function showGroupMemberModal(groupId) {
  openModal('Kelola Anggota Kelompok', '<div class="text-center py-6 text-gray-400">Memuat...</div>');
  try {
    const grpRes = await state.groupsModule.getGroupById(groupId);
    const allMembersRes = await state.membersModule.getMembers({ status: 'active' });
    const groupMembersRes = { ok: true, data: (grpRes.data?.members || []) };
    if (!grpRes.ok) { toast(grpRes.message, 'error'); closeModal(); return; }
    const g = grpRes.data;
    const allMembers = allMembersRes.data || [];
    const inGroupIds = (groupMembersRes.data || []).map(m => m.member_id);

    $('modalTitle').textContent = g.name;
    $('modalBody').innerHTML = `
      <div class="space-y-3">
        <div class="bg-blue-900/40 border border-blue-700/50 rounded-lg p-3 text-xs text-blue-200">
          <strong>${inGroupIds.length}</strong> dari <strong>${allMembers.length}</strong> anggota terdaftar.
        </div>
        <div>
          <div class="flex items-center justify-between mb-2">
            <h4 class="font-semibold text-gray-100 text-sm">Daftar Anggota</h4>
            <div class="flex gap-2">
              <button id="checkAllBtn" class="text-xs text-blue-400 hover:text-blue-300 font-semibold">Pilih Semua</button>
              <button id="uncheckAllBtn" class="text-xs text-gray-400 hover:text-gray-300 font-semibold">Kosongkan</button>
            </div>
          </div>
          <div id="groupMembersList" class="max-h-72 overflow-y-auto border border-gray-600 rounded-lg divide-y divide-gray-700 bg-gray-700/50">
            ${allMembers.length ? allMembers.map(m => {
              const checked = inGroupIds.indexOf(m.id) !== -1;
              return `
                <label class="flex items-center gap-3 px-3 py-2 hover:bg-gray-700 cursor-pointer">
                  <input type="checkbox" value="${m.id}" class="gm-chk rounded bg-gray-700 border-gray-600" ${checked ? 'checked' : ''}>
                  <span class="font-bold text-blue-400 text-sm w-8">${String(m.number).padStart(2, '0')}</span>
                  <span class="text-sm text-gray-100 flex-1">${escapeHtml(m.name)}</span>
                  <span class="text-xs text-gray-500">${escapeHtml(m.phone || '')}</span>
                </label>`;
            }).join('') : '<div class="text-xs text-gray-400 text-center py-4">Belum ada anggota aktif.</div>'}
          </div>
        </div>
        <div class="flex gap-2 justify-end pt-2 border-t border-gray-700">
          <button data-close-modal class="px-4 py-2 rounded-lg border border-gray-600 text-gray-300 hover:bg-gray-700 text-sm transition">Batal</button>
          <button id="saveGMBtn" class="px-4 py-2 rounded-lg bg-purple-600 hover:bg-purple-500 text-white text-sm font-semibold transition">Simpan</button>
        </div>
      </div>`;
    document.querySelectorAll('#modal [data-close-modal]').forEach(el => el.addEventListener('click', closeModal));

    $('checkAllBtn').addEventListener('click', () => document.querySelectorAll('.gm-chk').forEach(c => c.checked = true));
    $('uncheckAllBtn').addEventListener('click', () => document.querySelectorAll('.gm-chk').forEach(c => c.checked = false));

    $('saveGMBtn').addEventListener('click', async () => {
      const checked = Array.from(document.querySelectorAll('.gm-chk:checked')).map(c => c.value);
      const btn = $('saveGMBtn');
      btn.disabled = true; btn.textContent = 'Menyimpan...';
      pauseIdle();
      try {
        const toAdd = checked.filter(id => inGroupIds.indexOf(id) === -1);
        const toRemove = inGroupIds.filter(id => checked.indexOf(id) === -1);
        if (toAdd.length) {
          const res = await state.groupMembersModule.addMemberToGroup(groupId, toAdd);
          if (!res.ok) { toast(res.message, 'error'); btn.disabled = false; btn.textContent = 'Simpan'; resumeIdle(); return; }
        }
        for (const mid of toRemove) {
          await state.groupMembersModule.removeMemberFromGroup(groupId, mid);
        }
        toast('Tersimpan: +' + toAdd.length + ', -' + toRemove.length, 'success');
        closeModal();
        await loadAllData();
        switchView('groups');
      } catch (e) { toast('Terjadi kesalahan.', 'error'); }
      finally { btn.disabled = false; btn.textContent = 'Simpan'; resumeIdle(); }
    });
  } catch (e) { toast('Gagal memuat.', 'error'); }
}

function confirmDeleteGroup(id) {
  const g = state.cache.groups.find(x => x.id === id);
  if (!g) return;
  openModal('Hapus Kelompok', `
    <p class="text-sm text-gray-300">Yakin ingin menghapus <strong class="text-gray-100">${escapeHtml(g.name)}</strong>?</p>
    <p class="text-xs text-red-400 mt-2"><i class="fa-solid fa-triangle-exclamation"></i> Relasi anggota & data terkait akan ikut terhapus.</p>
    <div class="flex gap-2 justify-end pt-5">
      <button data-close-modal class="px-4 py-2 rounded-lg border border-gray-600 text-gray-300 hover:bg-gray-700 text-sm transition">Batal</button>
      <button id="confirmDelG" class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white text-sm font-semibold transition">Hapus</button>
    </div>`);
  document.querySelectorAll('#modal [data-close-modal]').forEach(el => el.addEventListener('click', closeModal));
  $('confirmDelG').addEventListener('click', async () => {
    const btn = $('confirmDelG');
    btn.disabled = true; btn.textContent = 'Menghapus...';
    pauseIdle();
    try {
      const res = await state.groupsModule.deleteGroup(id);
      if (res.ok) {
        toast(res.message, 'success');
        closeModal();
        await loadAllData();
        switchView('groups');
      } else toast(res.message, 'error');
    } catch (e) { toast('Terjadi kesalahan.', 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Hapus'; resumeIdle(); }
  });
}

/* ============================================================
   PAYMENTS (Grouped Accordion)
   ============================================================ */
const payUI = {
  expandedGroups: {},
  expandedPeriods: {},
  filterGroup: 'all',
  filterStatus: 'all',
  filterSearch: ''
};

async function renderPayments() {
  if (!state.cache.payments.length) {
    const res = await state.paymentsModule.getPayments({});
    if (res.ok) state.cache.payments = res.data;
  }

  payUI.expandedGroups = {};
  payUI.expandedPeriods = {};
  payUI.filterGroup = 'all';
  payUI.filterStatus = 'all';
  payUI.filterSearch = '';

  document.getElementById('mainContent').innerHTML = `
    <section class="space-y-3">
      <div class="bg-gray-800 rounded-2xl p-4 sm:p-5 shadow-sm border border-gray-700">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
          <div>
            <h3 class="font-bold text-gray-100 text-lg flex items-center gap-2"><i class="fa-solid fa-credit-card text-blue-400"></i> Pembayaran</h3>
            <p class="text-xs text-gray-400 mt-0.5">Kelola status pembayaran per kelompok & putaran <span class="text-emerald-400">● live</span></p>
          </div>
          <button id="expandAllBtn" class="px-3 py-1.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-gray-200 text-xs font-semibold transition"><i class="fa-solid fa-up-down"></i> Buka/Tutup Semua</button>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
          <select id="payGroup" class="px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 text-sm focus:border-blue-500 outline-none">
            <option value="all">Semua Kelompok</option>
            ${state.cache.groups.map(g => `<option value="${g.id}">${escapeHtml(g.name)}</option>`).join('')}
          </select>
          <select id="payStatus" class="px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 text-sm focus:border-blue-500 outline-none">
            <option value="all">Semua Status</option>
            <option value="paid">Lunas</option>
            <option value="partial">Sebagian</option>
            <option value="unpaid">Belum Bayar</option>
            <option value="pending">Menunggu</option>
            <option value="rejected">Ditolak</option>
          </select>
          <input id="paySearch" type="text" placeholder="Cari anggota..." class="col-span-2 px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 placeholder-gray-500 text-sm focus:border-blue-500 outline-none">
        </div>
        <div id="payStats" class="grid grid-cols-4 gap-2 mt-3"></div>
      </div>
      <div id="payGroupList" class="space-y-3"></div>
      <div id="payEmpty" class="hidden text-center text-gray-400 py-12 bg-gray-800 rounded-2xl border border-gray-700">
        <i class="fa-solid fa-credit-card text-5xl text-gray-600 mb-3"></i>
        <div class="font-semibold text-gray-300">Belum Ada Pembayaran</div>
        <p class="text-xs mt-1">Tambahkan anggota ke kelompok untuk auto-generate tagihan</p>
      </div>
    </section>`;

  renderPaymentsList();

  document.getElementById('payGroup').addEventListener('change', () => { payUI.filterGroup = document.getElementById('payGroup').value; renderPaymentsList(); });
  document.getElementById('payStatus').addEventListener('change', () => { payUI.filterStatus = document.getElementById('payStatus').value; renderPaymentsList(); });
  document.getElementById('paySearch').addEventListener('input', (e) => { payUI.filterSearch = e.target.value.toLowerCase(); renderPaymentsList(); });
  document.getElementById('expandAllBtn').addEventListener('click', toggleAllGroups);
}

function toggleAllGroups() {
  const groups = state.cache.groups;
  const allExpanded = groups.every(g => payUI.expandedGroups[g.id]);
  groups.forEach(g => { payUI.expandedGroups[g.id] = !allExpanded; });
  if (!allExpanded) Object.keys(payUI.expandedPeriods).forEach(k => { payUI.expandedPeriods[k] = false; });
  renderPaymentsList();
}

function renderPaymentsList() {
  let filtered = state.cache.payments.slice();
  if (payUI.filterGroup !== 'all') filtered = filtered.filter(p => p.group_id === payUI.filterGroup);
  if (payUI.filterStatus !== 'all') filtered = filtered.filter(p => p.status === payUI.filterStatus);
  if (payUI.filterSearch) {
    filtered = filtered.filter(p =>
      String(p.member_name || '').toLowerCase().includes(payUI.filterSearch) ||
      String(p.member_number || '').includes(payUI.filterSearch)
    );
  }

  const total = filtered.length;
  const paid = filtered.filter(p => p.status === 'paid').length;
  const partial = filtered.filter(p => p.status === 'partial').length;
  const unpaid = filtered.filter(p => p.status === 'unpaid').length;
  const pending = filtered.filter(p => p.status === 'pending').length;
  const rejected = filtered.filter(p => p.status === 'rejected').length;

  const statsEl = document.getElementById('payStats');
  if (!statsEl) return;

  statsEl.innerHTML = `
    <div class="bg-gray-700 rounded-lg p-2 text-center">
      <div class="text-[10px] text-gray-400 uppercase font-semibold">Total</div>
      <div class="text-base font-bold text-gray-100">${total}</div>
    </div>
    <div class="bg-emerald-900/40 rounded-lg p-2 text-center ring-1 ring-emerald-700/30">
      <div class="text-[10px] text-emerald-300 uppercase font-semibold">Lunas</div>
      <div class="text-base font-bold text-emerald-200">${paid}</div>
    </div>
    <div class="bg-blue-900/40 rounded-lg p-2 text-center ring-1 ring-blue-700/30">
      <div class="text-[10px] text-blue-300 uppercase font-semibold">Sebagian</div>
      <div class="text-base font-bold text-blue-200">${partial}</div>
    </div>
    <div class="bg-amber-900/40 rounded-lg p-2 text-center ring-1 ring-amber-700/30">
      <div class="text-[10px] text-amber-300 uppercase font-semibold">Belum</div>
      <div class="text-base font-bold text-amber-200">${unpaid + pending + rejected}</div>
    </div>
  `;

  const byGroup = {};
  filtered.forEach(p => {
    if (!byGroup[p.group_id]) byGroup[p.group_id] = [];
    byGroup[p.group_id].push(p);
  });

  let groupsToShow = state.cache.groups.slice();
  if (payUI.filterGroup !== 'all') groupsToShow = groupsToShow.filter(g => g.id === payUI.filterGroup);
  groupsToShow = groupsToShow.filter(g => byGroup[g.id] && byGroup[g.id].length > 0);

  const list = document.getElementById('payGroupList');
  const empty = document.getElementById('payEmpty');
  if (!list) return;
  if (groupsToShow.length === 0) { list.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');

  list.innerHTML = groupsToShow.map(g => renderGroupAccordion(g, byGroup[g.id] || [])).join('');

  list.querySelectorAll('[data-toggle-group]').forEach(el => {
    el.addEventListener('click', () => {
      const gid = el.dataset.toggleGroup;
      payUI.expandedGroups[gid] = !payUI.expandedGroups[gid];
      renderPaymentsList();
    });
  });
  list.querySelectorAll('[data-toggle-period]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = el.dataset.togglePeriod;
      payUI.expandedPeriods[key] = !payUI.expandedPeriods[key];
      renderPaymentsList();
    });
  });
  list.querySelectorAll('[data-pay-action]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const p = state.cache.payments.find(x => x.id === el.dataset.payAction);
      if (p) showPaymentModal(p);
    });
  });
  list.querySelectorAll('[data-wa-reminder]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const p = state.cache.payments.find(x => x.id === el.dataset.waReminder);
      if (p) quickWaReminder(p);
    });
  });
  list.querySelectorAll('[data-pay-partial]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const p = state.cache.payments.find(x => x.id === el.dataset.payPartial);
      if (p) showPartialModal(p);
    });
  });
  list.querySelectorAll('[data-bulk-period]').forEach(el => {
    el.addEventListener('click', async (e) => {
      e.stopPropagation();
      const [groupId, period] = el.dataset.bulkPeriod.split('|');
      await bulkMarkPeriodPaid(groupId, Number(period));
    });
  });
}

function renderGroupAccordion(group, payments) {
  const isExpanded = !!payUI.expandedGroups[group.id];
  const total = payments.length;
  const paid = payments.filter(p => p.status === 'paid').length;
  const pending = payments.filter(p => p.status === 'pending').length;
  const partial = payments.filter(p => p.status === 'partial').length;
  const unpaid = payments.filter(p => p.status === 'unpaid').length;
  const rejected = payments.filter(p => p.status === 'rejected').length;
  const progress = total ? Math.round(paid / total * 100) : 0;

  const byPeriod = {};
  payments.forEach(p => {
    const pn = Number(p.period_number) || 0;
    if (!byPeriod[pn]) byPeriod[pn] = [];
    byPeriod[pn].push(p);
  });
  const periods = Object.keys(byPeriod).map(Number).sort((a, b) => a - b);
  const progressColor = progress >= 80 ? 'bg-emerald-500' : progress >= 50 ? 'bg-amber-500' : 'bg-red-500';
  const progressTextColor = progress >= 80 ? 'text-emerald-400' : progress >= 50 ? 'text-amber-400' : 'text-red-400';

  return `
    <article class="bg-gray-800 rounded-2xl shadow-sm border border-gray-700 overflow-hidden">
      <div data-toggle-group="${group.id}" class="cursor-pointer select-none p-4 hover:bg-gray-700/50 transition">
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-3 min-w-0 flex-1">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white font-bold text-lg flex-shrink-0">
              <i class="fa-solid ${isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'}"></i>
            </div>
            <div class="min-w-0 flex-1">
              <h3 class="font-bold text-gray-100 truncate">${escapeHtml(group.name)}</h3>
              <div class="text-xs text-gray-400 mt-0.5">${group.period_days} hari • ${formatIDR(group.amount)} • ${periods.length} putaran</div>
            </div>
          </div>
          <div class="text-right flex-shrink-0">
            <div class="text-lg font-bold ${progressTextColor}">${progress}%</div>
            <div class="text-[10px] text-gray-500 uppercase">Lunas</div>
          </div>
        </div>
        <div class="mt-3 w-full h-1.5 bg-gray-700 rounded-full overflow-hidden">
          <div class="h-full ${progressColor} transition-all duration-300" style="width: ${progress}%"></div>
        </div>
        <div class="mt-2 flex flex-wrap gap-1.5 text-[10px]">
          <span class="bg-gray-700 text-gray-300 px-2 py-0.5 rounded-full font-semibold">Total: ${total}</span>
          <span class="bg-emerald-900/40 text-emerald-300 px-2 py-0.5 rounded-full font-semibold"><i class="fa-solid fa-check"></i> ${paid}</span>
          ${partial ? `<span class="bg-blue-900/40 text-blue-300 px-2 py-0.5 rounded-full font-semibold">◑ ${partial}</span>` : ''}
          ${unpaid ? `<span class="bg-gray-600 text-gray-300 px-2 py-0.5 rounded-full font-semibold">○ ${unpaid}</span>` : ''}
          ${pending ? `<span class="bg-amber-900/40 text-amber-300 px-2 py-0.5 rounded-full font-semibold">◐ ${pending}</span>` : ''}
          ${rejected ? `<span class="bg-red-900/40 text-red-300 px-2 py-0.5 rounded-full font-semibold">✗ ${rejected}</span>` : ''}
        </div>
      </div>
      ${isExpanded ? `
        <div class="border-t border-gray-700 bg-gray-900/50 p-3 space-y-2">
          ${periods.map(pn => renderPeriodAccordion(group, pn, byPeriod[pn])).join('')}
        </div>
      ` : ''}
    </article>`;
}

function renderPeriodAccordion(group, periodNumber, payments) {
  const key = group.id + '_' + periodNumber;
  const isExpanded = !!payUI.expandedPeriods[key];
  const total = payments.length;
  const paid = payments.filter(p => p.status === 'paid').length;
  const pending = payments.filter(p => p.status === 'pending').length;
  const partial = payments.filter(p => p.status === 'partial').length;
  const unpaid = payments.filter(p => p.status === 'unpaid').length;
  const allPaid = paid === total;
  const progress = total ? Math.round(paid / total * 100) : 0;
  const dueDate = payments[0] ? payments[0].due_date : '-';

  return `
    <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
      <div data-toggle-period="${key}" class="cursor-pointer select-none p-3 flex items-center gap-3 hover:bg-gray-700/50 transition">
        <span class="text-gray-400 text-xs"><i class="fa-solid ${isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'}"></i></span>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-semibold text-gray-100 text-sm">Putaran ${periodNumber}</span>
            ${allPaid
              ? '<span class="text-[10px] bg-emerald-900/40 text-emerald-300 ring-1 ring-emerald-700/50 px-1.5 py-0.5 rounded-full font-bold"><i class="fa-solid fa-check"></i> LUNAS</span>'
              : `<span class="text-[10px] bg-amber-900/40 text-amber-300 ring-1 ring-amber-700/50 px-1.5 py-0.5 rounded-full font-bold">${progress}%</span>`}
          </div>
          <div class="text-[11px] text-gray-400 mt-0.5">
            JT: ${formatDate(dueDate)} • ${paid}/${total} lunas${partial ? ' • ' + partial + ' sebagian' : ''}${pending ? ' • ' + pending + ' menunggu' : ''}${unpaid ? ' • ' + unpaid + ' belum' : ''}
          </div>
        </div>
        ${!allPaid ? `
          <button data-bulk-period="${group.id}|${periodNumber}" class="text-[10px] bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition" onclick="event.stopPropagation();">✓ Lunas Semua</button>
        ` : ''}
      </div>
      ${isExpanded ? `
        <div class="border-t border-gray-700 divide-y divide-gray-700">
          ${payments.map(p => renderPaymentRowCompact(p)).join('')}
        </div>
      ` : ''}
    </div>`;
}

function renderPaymentRowCompact(p) {
  const statusMap = {
    paid:     { label: 'Lunas',    cls: 'bg-emerald-900/40 text-emerald-300', icon: 'fa-circle-check' },
    partial:  { label: 'Sebagian', cls: 'bg-blue-900/40 text-blue-300',       icon: 'fa-circle-half-stroke' },
    unpaid:   { label: 'Belum',    cls: 'bg-gray-700 text-gray-300',          icon: 'fa-circle' },

async function bulkMarkPeriodPaid(groupId, periodNumber) {
  const target = state.cache.payments.filter(p =>
    p.group_id === groupId && Number(p.period_number) === periodNumber && p.status !== 'paid'
  );
  if (!target.length) { toast('Semua pembayaran putaran ini sudah lunas.', 'info'); return; }
  if (!confirm(`Tandai ${target.length} pembayaran di Putaran ${periodNumber} sebagai LUNAS?`)) return;

  pauseIdle();
  const res = await state.paymentsModule.bulkMarkPeriodPaid(groupId, periodNumber);
  resumeIdle();
  if (res.ok) {
    toast(`Berhasil: ${res.updated} lunas`, 'success');
  } else {
    toast(res.message || 'Gagal.', 'error');
  }
}

async function loadReminders() {
  const groupId = document.getElementById('remGroup').value;
  const period = document.getElementById('remPeriod').value ? Number(document.getElementById('remPeriod').value) : null;
  const box = document.getElementById('reminderResult');
  box.innerHTML = '<div class="bg-gray-800 rounded-2xl p-8 text-center text-gray-400 text-sm shadow-sm border border-gray-700">Memuat...</div>';

  try {
    // Filter dari cache
    let list = state.cache.payments.filter(p => p.status !== 'paid' && p.status !== 'rejected');
    if (groupId) list = list.filter(p => p.group_id === groupId);
    if (period) list = list.filter(p => Number(p.period_number) === period);

    if (!list.length) {
      box.innerHTML = '<div class="bg-emerald-900/40 border border-emerald-700/50 text-emerald-200 rounded-2xl p-6 text-center text-sm"><div class="text-4xl mb-2 text-emerald-400"><i class="fa-solid fa-circle-check"></i></div>Semua pembayaran sudah lunas!</div>';
      return;
    }

    const byGroup = {};
    list.forEach(item => {
      const gname = item.group_name || '-';
      if (!byGroup[gname]) byGroup[gname] = [];
      byGroup[gname].push(item);
    });

    box.innerHTML = `
      <div class="bg-gray-800 rounded-2xl p-4 sm:p-5 shadow-sm border border-gray-700">
        <div class="flex items-center justify-between mb-3">
          <div>
            <div class="font-bold text-gray-100"><i class="fa-solid fa-clipboard-list text-blue-400"></i> ${list.length} anggota perlu diingatkan</div>
            <div class="text-xs text-gray-400">Klik tombol per anggota atau kirim semua</div>
          </div>
          <button id="bulkSendBtn" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition"><i class="fa-solid fa-paper-plane"></i> Kirim Semua</button>
        </div>
        ${Object.keys(byGroup).map(gname => `
          <div class="mb-4 last:mb-0">
            <div class="text-xs font-bold text-gray-400 uppercase mb-2"><i class="fa-solid fa-folder text-blue-400"></i> ${escapeHtml(gname)}</div>
            <div class="space-y-1.5">
              ${byGroup[gname].map(item => renderReminderRow(item)).join('')}
            </div>
          </div>`).join('')}
      </div>`;

    box.querySelectorAll('[data-wa-single]').forEach(el => {
      el.addEventListener('click', () => {
        const item = list.find(x => x.id === el.dataset.waSingle);
        if (item) sendWaToMember(item);
      });
    });
    document.getElementById('bulkSendBtn').addEventListener('click', () => sendBulkWa(list));
  } catch (e) {
    console.error(e);
    box.innerHTML = '<div class="bg-red-900/40 text-red-200 rounded-2xl p-4 text-sm ring-1 ring-red-700/50">Terjadi kesalahan.</div>';
  }
}

function renderReminderRow(item) {
  const hasPhone = item.member_phone && item.member_phone.trim();
  const isPartial = Number(item.paid_amount || 0) > 0;
  const remaining = Number(item.amount || 0) - Number(item.paid_amount || 0);
  return `
    <div class="flex items-center gap-2 px-3 py-2 rounded-lg border border-gray-700 hover:bg-gray-700/50 transition">
      <div class="w-8 h-8 rounded-lg bg-blue-900/40 ring-1 ring-blue-700/40 flex items-center justify-center font-bold text-blue-300 text-xs flex-shrink-0">
        ${escapeHtml(String(item.member_number || '-').padStart(2, '0'))}
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-medium text-gray-100 truncate">${escapeHtml(item.member_name)}</div>
        <div class="text-[11px] text-gray-500">
          Putaran ${item.period_number} • ${isPartial ? 'sisa ' + formatIDR(remaining) : formatIDR(item.amount)} • JT ${formatDate(item.due_date)}
        </div>
      </div>
      ${hasPhone
        ? `<button data-wa-single="${item.id}" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold whitespace-nowrap transition"><i class="fa-brands fa-whatsapp"></i> Kirim</button>`
        : `<span class="text-[10px] text-red-400 italic px-2">No HP kosong</span>`}
    </div>`;

async function sendWaToMember(item) {
  if (!item.member_phone) { toast('Nomor HP tidak ada.', 'error'); return; }
  const settings = state.cache.settings || {};
  let template = settings.wa_template_reminder || 'Halo [nama], iuran [kelompok] Putaran [putaran] sebesar [jumlah] jatuh tempo [tanggal].';
  const paidAmount = Number(item.paid_amount || 0);
  const remaining = Number(item.amount || 0) - paidAmount;
  const message = fillTemplate(template, {
    nama: item.member_name,
    kelompok: item.group_name,
    putaran: item.period_number,
    jumlah: formatIDR(remaining > 0 ? remaining : item.amount),
    tanggal: formatDate(item.due_date),
    total_tagihan: formatIDR(item.amount),
    sudah_dibayar: formatIDR(paidAmount),
    sisa: formatIDR(remaining)
  });
  const ok = openWhatsApp(item.member_phone, message);
  if (ok) toast('Membuka WhatsApp untuk ' + item.member_name, 'success');
}

async function sendBulkWa(list) {
  const withPhone = list.filter(item => item.member_phone && item.member_phone.trim());
  if (!withPhone.length) { toast('Tidak ada anggota dengan nomor HP.', 'error'); return; }
  if (!confirm(`Buka WhatsApp untuk ${withPhone.length} anggota satu per satu?`)) return;

  const btn = document.getElementById('bulkSendBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
  pauseIdle();

  for (let i = 0; i < withPhone.length; i++) {
    const item = withPhone[i];
    try {
      await sendWaToMember(item);
      if (i < withPhone.length - 1) await new Promise(r => setTimeout(r, 1500));
    } catch (e) { console.error(e); }
  }
  btn.disabled = false;
  btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Semua';
  resumeIdle();
  toast(`Selesai ${withPhone.length} WhatsApp.`, 'success');
}

async function onDrawGroupChange() {
  state.drawState.groupId = $('drawGroup').value;
  state.drawState.period = Number($('drawPeriod').value) || 1;
  await loadCandidates();
}
async function onDrawPeriodChange() {
  state.drawState.period = Number($('drawPeriod').value) || 1;
  await loadCandidates();
}
async function loadCandidates() {
  const infoBox = document.getElementById('candidateInfo');
  if (!state.drawState.groupId) { infoBox.classList.add('hidden'); return; }
  
  try {
    // Firebase call
    const res = await state.winnersModule.getCandidates(state.drawState.groupId, state.drawState.period);
    
    if (!res.ok) { 
      toast(res.message || 'Gagal memuat kandidat.', 'error'); 
      infoBox.classList.add('hidden'); 
      return; 
    }
    
    const d = res.data;
    state.drawState.candidates = d.candidates || [];
    
    infoBox.classList.remove('hidden');
    infoBox.innerHTML = `
      <div class="grid grid-cols-3 gap-2 text-center">
        <div><div class="text-xs text-gray-400">Total Anggota</div><div class="text-lg font-bold text-gray-100">${d.totalMembers}</div></div>
        <div><div class="text-xs text-gray-400">Sudah Menang</div><div class="text-lg font-bold text-amber-400">${d.totalWinners}</div></div>
        <div><div class="text-xs text-gray-400">Kandidat Sisa</div><div class="text-lg font-bold text-blue-400">${d.remaining}</div></div>
      </div>
      ${d.allowRepeat ? '<div class="text-xs text-emerald-300 mt-2 text-center">Kelompok mengizinkan pemenang berulang.</div>' : '<div class="text-xs text-gray-400 mt-2 text-center">Anggota yang sudah menang tidak muncul lagi.</div>'}`;
    
    renderMethodPanel();
  } catch (e) {
    console.error('loadCandidates error:', e);
    toast('Gagal memuat kandidat.', 'error');
    infoBox.classList.add('hidden');
  }
}

function setMethod(method) {
  state.drawState.method = method;
  document.querySelectorAll('.method-btn').forEach(b => {
    if (b.dataset.method === method) {
      b.classList.add('bg-blue-600','text-white','border-blue-500');
      b.classList.remove('text-gray-300','border-gray-600');
    } else {
      b.classList.remove('bg-blue-600','text-white','border-blue-500');
      b.classList.add('text-gray-300','border-gray-600');
    }
  });
  renderMethodPanel();
}

function renderMethodPanel() {
  const panel = $('methodPanel');
  if (!panel) return;
  if (!state.drawState.groupId) {
    panel.innerHTML = '<div class="text-sm text-gray-400 bg-gray-700/50 border border-gray-600 rounded-lg p-3">Silakan pilih kelompok terlebih dahulu.</div>';
    return;
  }
  if (state.drawState.method === 'random') {

      </div>`;

    panel.innerHTML = `

      <div class="flex flex-col sm:flex-row gap-2">

          ${state.drawState.candidates.map(m => `<option value="${m.id}">No. ${m.number} — ${escapeHtml(m.name)}</option>`).join('')}

        <button id="drawPredBtn" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition">Tetapkan Pemenang</button>
      </div>`;
    $('drawPredBtn').addEventListener('click', drawPredetermined);
  }
}

async function startRandomDraw() {
  if (state.drawState.animating) return;
  if (!state.drawState.groupId) { toast('Data kelompok belum dipilih.', 'error'); return; }
  if (!state.drawState.candidates.length) { toast('Belum ada kandidat yang tersedia.', 'error'); return; }
  state.drawState.animating = true;
  pauseIdle();
  const stage = $('drawStage');
  stage.classList.remove('hidden');
  $('drawStageContent').innerHTML = `
    <div class="text-sm text-gray-400 mb-2 flex items-center justify-center gap-2"><i class="fa-solid fa-dice fa-spin"></i> Mengundi...</div>
    <div id="rollNumber" class="text-5xl sm:text-6xl font-extrabold text-blue-400">--</div>
    <div id="rollName" class="text-xl sm:text-2xl font-bold text-gray-100 mt-2">Memilih kandidat...</div>`;
  const rollNumber = $('rollNumber');
  const rollName = $('rollName');
  const candidates = state.drawState.candidates;
  let ticks = 0;
  const interval = setInterval(() => {
    const r = candidates[Math.floor(Math.random() * candidates.length)];
    rollNumber.textContent = String(r.number).padStart(2, '0');
    rollName.textContent = r.name;
    ticks++;
    if (ticks >= 30) { clearInterval(interval); finalizeRandomDraw(); }
  }, 90);
}

async function finalizeRandomDraw() {
  const stage = $('drawStage');
  try {
    const res = await state.winnersModule.drawRandomWinner(state.drawState.groupId, state.drawState.period, '');
    if (!res.ok) { stage.classList.add('hidden'); toast(res.message, 'error'); state.drawState.animating = false; resumeIdle(); return; }
    renderWinnerResult(res.data, 'random');
  } catch (e) { stage.classList.add('hidden'); toast('Terjadi kesalahan.', 'error'); }
  finally { state.drawState.animating = false; resumeIdle(); }
}

async function drawByNumber() {
  const num = Number($('drawNumber').value);
  if (!num) { toast('Nomor anggota tidak valid.', 'error'); return; }
  pauseIdle();
  try {
    const res = await state.winnersModule.drawWinnerByNumber(state.drawState.groupId, state.drawState.period, num, '');
    if (!res.ok) { toast(res.message, 'error'); return; }
    $('drawStage').classList.remove('hidden');
    renderWinnerResult(res.data, 'number');
  } catch (e) { toast('Terjadi kesalahan.', 'error'); }
  finally { resumeIdle(); }
}

async function drawPredetermined() {
  const mid = $('drawMember').value;
  if (!mid) { toast('Anggota belum dipilih.', 'error'); return; }
  pauseIdle();
  try {
    const res = await state.winnersModule.setPredeterminedWinner(state.drawState.groupId, state.drawState.period, mid, '');
    if (!res.ok) { toast(res.message, 'error'); return; }
    $('drawStage').classList.remove('hidden');
    renderWinnerResult(res.data, 'predetermined');
  } catch (e) { toast('Terjadi kesalahan.', 'error'); }
  finally { resumeIdle(); }
}

  const g = document.getElementById('winGroup')?.value || 'all';

function computeReportData(groupId, selectedPeriods) {
  const filterGroupId = (groupId && groupId !== 'all') ? groupId : null;
  const filterPeriods = (selectedPeriods && selectedPeriods.length > 0) ? selectedPeriods : null;

  // Groups
  let groups = state.cache.groups;
  if (filterGroupId) groups = groups.filter(g => g.id === filterGroupId);

  // Payments
  let payments = state.cache.payments.map(p => ({
    ...p,
    paid_amount: Number(p.paid_amount || 0),
    remaining: Number(p.amount || 0) - Number(p.paid_amount || 0)
  }));
  if (filterGroupId) payments = payments.filter(p => p.group_id === filterGroupId);
  if (filterPeriods) payments = payments.filter(p => filterPeriods.includes(Number(p.period_number)));

  // Transactions - filter based on payments' groups & periods
  // (transaksi terkait pembayaran)
  let transactions = state.cache.transactions;
  if (filterGroupId) transactions = transactions.filter(t => t.group_id === filterGroupId);
  
  // Kalau filter period aktif, hanya tampilkan transaksi dari payments yang terpilih
  if (filterPeriods) {
    const allowedPaymentIds = new Set(payments.map(p => p.id));
    transactions = transactions.filter(t => {
      // Transaksi manual (tanpa payment_id) → tetap tampil
      if (!t.payment_id) return true;
      // Transaksi dari payment → hanya kalau payment-nya terpilih
      return allowedPaymentIds.has(t.payment_id);
    });
  }

  // Winners
  let winners = state.cache.winners;
  if (filterGroupId) winners = winners.filter(w => w.group_id === filterGroupId);
  if (filterPeriods) winners = winners.filter(w => filterPeriods.includes(Number(w.period_number)));

  const totalIncome = transactions.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount || 0), 0);
  const totalExpense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0);

  // Group summary
  const groupSummary = {};
  payments.forEach(p => {
    if (!groupSummary[p.group_id]) {
      groupSummary[p.group_id] = {
        group_id: p.group_id,
        group_name: p.group_name,
        total: 0, paid: 0, partial: 0, unpaid: 0,
        totalAmount: 0, totalPaid: 0
      };
    }
    const gs = groupSummary[p.group_id];
    gs.total++;
    gs.totalAmount += Number(p.amount || 0);
    gs.totalPaid += Number(p.paid_amount || 0);
    if (p.status === 'paid') gs.paid++;
    else if (p.status === 'partial') gs.partial++;
    else gs.unpaid++;
  });

  // Label putaran
  let periodLabel = 'Semua Putaran';
  if (filterPeriods && filterPeriods.length > 0) {
    const sorted = filterPeriods.slice().sort((a, b) => a - b);
    periodLabel = 'Putaran ' + sorted.map(p => 'P' + p).join(', ');
  }

  return {
    app_name: state.appName,
    filter: {
      group_id: filterGroupId || 'all',
      group_name: filterGroupId ? (state.cache.groups.find(g => g.id === filterGroupId)?.name || '-') : 'Semua Kelompok',
      periods: filterPeriods,
      period_label: periodLabel
    },
    summary: {
      totalTagihan: payments.length,
      totalLunas: payments.filter(p => p.status === 'paid').length,
      totalPartial: payments.filter(p => p.status === 'partial').length,
      totalBelum: payments.filter(p => p.status === 'unpaid' || p.status === 'pending').length,
      totalNilai: payments.reduce((s, p) => s + Number(p.amount || 0), 0),
      totalDibayar: payments.reduce((s, p) => s + Number(p.paid_amount || 0), 0),
      totalIncome, totalExpense, saldo: totalIncome - totalExpense
    },
    groupSummary: Object.values(groupSummary),
    payments: payments.slice().sort((a, b) => {
      const g = String(a.group_name || '').localeCompare(String(b.group_name || ''));
      if (g !== 0) return g;
      return Number(a.period_number) - Number(b.period_number);
    }),
    transactions,
    winners,
    generatedAt: new Date().toISOString()
  };
}

            <tr class="border-b border-gray-100">
              <td class="px-3 py-2 text-gray-600">Total Pemasukan</td>

              <td class="px-3 py-2 text-gray-600">Total Pengeluaran</td>
              <td class="px-3 py-2 text-right font-semibold text-red-700">${formatIDR(d.summary.totalExpense)}</td>
            </tr>
            <tr class="bg-gray-50">
              <td class="px-3 py-2 font-bold text-gray-800">Saldo</td>
              <td class="px-3 py-2 text-right font-bold ${d.summary.saldo >= 0 ? 'text-emerald-700' : 'text-red-700'}">${formatIDR(d.summary.saldo)}</td>

          </tbody>
        </table>
      </div>

      <div class="mb-5">
        <h4 class="font-bold text-gray-800 mb-2 text-sm uppercase tracking-wide">Status Pembayaran</h4>

          <div class="border border-emerald-200 rounded-lg p-2 bg-emerald-50"><div class="text-[10px] text-emerald-600 uppercase">Lunas</div><div class="text-lg font-bold text-emerald-700">${d.summary.totalLunas}</div></div>
          <div class="border border-blue-200 rounded-lg p-2 bg-blue-50"><div class="text-[10px] text-blue-600 uppercase">Sebagian</div><div class="text-lg font-bold text-blue-700">${d.summary.totalPartial}</div></div>
          <div class="border border-red-200 rounded-lg p-2 bg-red-50"><div class="text-[10px] text-red-600 uppercase">Belum</div><div class="text-lg font-bold text-red-700">${d.summary.totalBelum}</div></div>
        </div>
      </div>

      ${d.groupSummary.length > 1 ? `
        <div class="mb-5">
          <h4 class="font-bold text-gray-800 mb-2 text-sm uppercase tracking-wide">Ringkasan Per Kelompok</h4>
          <table class="w-full text-sm border border-gray-200">
            <thead class="bg-gray-50">
              <tr class="text-left text-xs text-gray-600">
                <th class="px-2 py-1.5">Kelompok</th>
                <th class="px-2 py-1.5 text-center">Total</th>
                <th class="px-2 py-1.5 text-center">Lunas</th>
                <th class="px-2 py-1.5 text-right">Nilai</th>
                <th class="px-2 py-1.5 text-right">Dibayar</th>
              </tr>
            </thead>
            <tbody>
              ${d.groupSummary.map(g => `
                <tr class="border-t border-gray-100">
                  <td class="px-2 py-1.5 font-medium">${escapeHtml(g.group_name)}</td>
                  <td class="px-2 py-1.5 text-center">${g.total}</td>
                  <td class="px-2 py-1.5 text-center text-emerald-700 font-semibold">${g.paid}</td>
                  <td class="px-2 py-1.5 text-right">${formatIDR(g.totalAmount)}</td>
                  <td class="px-2 py-1.5 text-right font-semibold">${formatIDR(g.totalPaid)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
